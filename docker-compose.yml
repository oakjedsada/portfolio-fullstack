services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./server
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=portfolio;Username=postgres;Password=devpass"
      FrontendUrl: "http://localhost:3000"
      ASPNETCORE_URLS: "http://+:8080"
      Smtp__User: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__NotifyTo: "${SMTP_NOTIFY_TO:-oakjedsada@gmail.com}"
    ports:
      - "5000:8080"
    depends_on:
      - db

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
